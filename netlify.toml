# Netlify configuration — Loss of Support Form, Dr Pretorius Inc.
#
# The functions directory deliberately sits OUTSIDE the publish directory. If it
# were inside, Netlify would serve send-form.js as a static file instead of
# running it as a function — the endpoint would 404 and the source, including
# the shape of every check it makes, would be downloadable.
#
# `public/_headers` is the source of truth for headers; the block below mirrors
# it so the rules survive even if _headers is ever missed.

[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "no-store"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# LAURA-los-003 / LAURA-sjaaccident-003. MIRRORS public/_headers, and it has to.
# The rule went into _headers alone first and did NOTHING: the [[headers]] block
# above with for = "/*" sets Cache-Control = "no-store", and netlify.toml wins
# over _headers on a conflicting value. The fonts rule below works precisely
# because it is in BOTH files. Verified live afterwards - the logo still came
# back no-store from a successful deploy.
#
# must-revalidate, not max-age+immutable: the comment on the fonts rule is right
# that no-store is partly why a deploy takes effect at once, and a logo is
# exactly the asset a firm asks to have changed. With the ETag Netlify already
# sends, a repeat visit gets a 304 and transfers nothing, and a new logo still
# appears the moment it deploys.
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/api/send-form"
  to = "/.netlify/functions/send-form"
  status = 200
  force = true

[[redirects]]
  from = "/api/form-recipients"
  to = "/.netlify/functions/form-recipients"
  status = 200
  force = true
